model = "gpt-5.6-luna"
model_catalog_json = "models-atlas-shell-only.json"
model_instructions_file = "atlas-agent-prompts/common.md"
developer_instructions = "Work autonomously within the requested implementation scope. Make the requested changes, run relevant checks/tests, and inspect the resulting diff/state. Do not commit, tag, or push; Atlas owns checkpoint and release transitions."
web_search = "disabled"

[agents]
enabled = false

[skills.bundled]
enabled = false

[features]
apps = false
multi_agent = false
multi_agent_v2 = false
plugins = false
skill_search = false
skill_mcp_dependency_install = false
skip_host_skill_discovery = true

[features.tool_registry]
allowed_tools = ["exec_command", "write_stdin", "apply_patch"]
