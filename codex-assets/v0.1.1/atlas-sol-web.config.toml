model = "gpt-5.6-sol"
model_catalog_json = "models-atlas-shell-only.json"
model_instructions_file = "atlas-agent-prompts/common.md"
developer_instructions = "Fresh, read-only factual audit. Establish current state from authoritative artifacts. Distinguish observed facts from inference and unavailable evidence. Do not repair or modify anything."
web_search = "live"

[agents]
enabled = false

[skills.bundled]
enabled = false

[features]
apps = false
multi_agent = false
multi_agent_v2 = false
plugins = false
skill_search = false
skill_mcp_dependency_install = false
skip_host_skill_discovery = true

[features.tool_registry]
allowed_tools = ["exec_command", "write_stdin", "web.run"]
