[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-core-v1"
version = "0.1.0"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov>=4",
]

[project.scripts]
atlas-agent = "tools.atlas_agent.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]


[tool.coverage.run]
branch = true
source = ["tools/atlas_agent"]
core = "ctrace"
patch = ["subprocess"]

[tool.coverage.html]
show_contexts = true
